<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Upload an image and classify its dominant color using a logistic-regression model.">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Dominant Color Classifier</title>
</head>
<body>
  <main class="page-shell">
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">Machine Learning Demo</p>
      <h1 id="page-title">Dominant Color Classifier</h1>
      <p class="intro">Upload an image to classify its average color into one of nine color categories.</p>

      {% if error %}
        <div class="alert" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" enctype="multipart/form-data" id="prediction-form">
        <label for="image-upload">Choose an image</label>
        <input type="file" id="image-upload" name="image" accept="image/png,image/jpeg" required>

        <img id="preview" alt="Selected image preview">

        <button type="submit" id="submit-button">Predict color</button>
        <p id="loading-message" class="loading" aria-live="polite" hidden>Analyzing image…</p>
      </form>

      {% if predicted_color %}
        <section class="result" aria-live="polite">
          <div>
            <p class="result-label">Prediction</p>
            <h2>{{ predicted_color }}</h2>
          </div>
          <div class="swatch" style="background: {{ preview_color }};" aria-label="Average image color"></div>
        </section>
      {% endif %}
    </section>
  </main>

  <script>
    const input = document.getElementById('image-upload');
    const preview = document.getElementById('preview');
    const form = document.getElementById('prediction-form');
    const submitButton = document.getElementById('submit-button');
    const loadingMessage = document.getElementById('loading-message');

    input.addEventListener('change', () => {
      const [file] = input.files;
      if (!file) {
        preview.removeAttribute('src');
        preview.classList.remove('visible');
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.classList.add('visible');
    });

    form.addEventListener('submit', () => {
      submitButton.disabled = true;
      loadingMessage.hidden = false;
    });
  </script>
</body>
</html>
